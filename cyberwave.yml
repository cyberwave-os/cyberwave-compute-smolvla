# Cyberwave Cloud Node configuration for SmolVLA
#
# Architecture:
#   smolvla/
#     install.sh              — venv + pip install lerobot + cyberwave SDK
#     deploy.py               — inference entrypoint  → CwProcessor + build_predict_fn
#     train.py                — training entrypoint   → CwTrainer + LeRobot training loop
#     preview.py              — preview entrypoint    → hot server or cold-start CwProcessorPreview
#     preview_server.py       — long-running FastAPI server: loads model once, serves /predict
#     cw_processor.py         — shared live-inference layer (MQTT, cameras, action loop)
#     cw_processor_preview.py — shared one-shot preview layer (image decode, single predict, no SDK)
#     cw_trainer.py           — shared training layer (dataset DL, WandB patch, API callbacks)
#     smolvla_resolver.py     — model-specific: camera mapping, state/action dims
#     smolvla_trainer.py      — model-specific: builds LeRobot training config
#
# This configuration enables SmolVLA inference and training for robot control.
#
# ============================================================================
# INFERENCE
# ============================================================================
#
# Model is loaded from local checkpoint (SMOLVLA_CHECKPOINT env var).
# Robot control and camera frames are handled via Cyberwave SDK.
#
# Required environment variables (set by Cloud Node):
#   - SMOLVLA_CHECKPOINT: Local path to SmolVLA checkpoint directory
#   - CYBERWAVE_API_KEY: For MQTT and API authentication
#   - CYBERWAVE_MQTT_HOST, CYBERWAVE_MQTT_PORT: MQTT broker details
#
# Expected inference JSON payload:
#   {
#     "robot_twin_uuid": "uuid-of-robot-twin",
#     "instruction": "pick up the red block",
#     "camera_endpoints_by_role": {
#       "primary_camera": "camera-twin-uuid-1",
#       "wrist_camera": "camera-twin-uuid-2"
#     },
#     "twin_calibration": {
#       "joint_1": {"min": -2.0, "max": 2.0},
#       ...
#     },
#     "calibration_robot_type": "follower",
#     "max_steps": 50,
#     "mode": "live"
#   }
#
# Camera mapping:
#   Training config contains camera names like "cam_7e7bf9fe" (non-semantic UUIDs).
#   Runtime cameras are mapped by position: first runtime camera -> first training camera.
#   Provide cameras via camera_endpoints_by_role (preferred) or camera_twin_uuids.
#
# ============================================================================
# TRAINING
# ============================================================================
#
# The training endpoint fine-tunes SmolVLA using PEFT/LoRA.
# Metrics are sent to Cyberwave API (not WandB) via PUT /api/v1/mltrainings/{id}.
# Upon completion, results are compressed to results_folder for upload.
#
# Required environment variables:
#   - CYBERWAVE_API_KEY: For API authentication (or pass cyberwave_token in params)
#   - CYBERWAVE_ENVIRONMENT: "production", "development", or "local"
#   - CYBERWAVE_BASE_URL or CYBERWAVE_API_URL: e.g. http://localhost:8000 for local Docker API
#
# Local dev: run `train.py` after the CLI has written ~/.cyberwave/credentials.json (token + envs),
# or export CYBERWAVE_BASE_URL and CYBERWAVE_API_KEY yourself. Use Python 3.12 or 3.13 (see install.sh).
#
# Expected training JSON payload:
#   {
#     "cyberwave_training_uuid": "uuid-of-training-job",
#     "cyberwave_token": "api-token",              # Optional if CYBERWAVE_API_KEY set
#     "dataset_uuid": "uuid-of-dataset",           # Dataset to download from API
#     "dataset_name": "my-dataset",                # Directory name for dataset
#     "data_root_dir": "./datasets",               # Root dir for datasets
#     "base_model": "lerobot/smolvla_base",        # HF hub ID (default)
#     "weights_url": "https://...",                # Optional: custom base weights tar
#     "output_dir": "./outputs/train/run",         # Checkpoint output directory
#     "max_steps": 50000,                          # Training steps (default: 50000)
#     "batch_size": 32,                            # Batch size (default: 32)
#     "num_workers": 12,                           # DataLoader workers (default: 12)
#     "lora_r": 16,                                # LoRA rank (default: 16)
#     "optimizer_lr": 1e-3,                        # Learning rate (default: 1e-3)
#     "scheduler_decay_lr": 1e-4,                  # LR decay (default: 1e-4)
#     "save_freq": 10000,                          # Checkpoint frequency (default: 10000)
#     "log_freq": 100,                             # Logging frequency (default: 100)
#     "compile_model": true,                       # Use torch.compile (default: true)
#     "use_peft": true                             # Use PEFT/LoRA (default: true)
#   }
#
# Training status updates are sent to:
#   PUT /api/v1/mltrainings/{cyberwave_training_uuid}
#   - update_type: "metrics" - step metrics (loss, etc.)
#   - update_type: "estimate" - ETA updates after ~100 steps
#   - status: "completed" / "failed" - final status
#
# ============================================================================

cyberwave-cloud-node:
  # Installation script - sets up Python venv and LeRobot dependencies
  install_script: ./install.sh

  # Inference: single entrypoint for both live and preview workloads.
  #
  # preview.py inspects the payload:
  #   - Contains "robot_twin_uuid"  → live inference via deploy.py / CwProcessor (MQTT loop)
  #   - Contains "mlmodel_uuid" only → playground preview via preview_server.py
  #
  # For preview workloads, preview.py self-manages preview_server.py:
  #   - GET /health distinguishes "HTTP up, model loading" (ready:false) from
  #     "no server" so we do not spawn duplicate FastAPI processes.
  #   - A flock + ~/.cyberwave/smolvla_preview_server_state.json (pid) serialize
  #     startup when several workloads race before the port is listening.
  #   - Polls until the model is ready (PREVIEW_SERVER_LOAD_TIMEOUT, default 180s)
  #     then POSTs /predict; on timeout, cold-starts inline.
  #   - The daemon survives between preview.py runs (start_new_session).
  #
  # Environment variables for preview (set on the GPU node):
  #   SMOLVLA_CHECKPOINT     Local path to SmolVLA checkpoint.
  #   SMOLVLA_BASE_MODEL     Optional base model for PEFT checkpoints.
  #   PREVIEW_SERVER_PORT    Port (default: 8765).
  #   PREVIEW_SERVER_HOST    Bind host (default: 127.0.0.1).
  #   PREVIEW_SERVER_LOAD_TIMEOUT  Seconds to wait for model load (default: 180).
  inference: |
    source "$HOME/.venv/smolvla/bin/activate" && \
    python deploy.py {body}

  # Training endpoint - fine-tunes SmolVLA with PEFT/LoRA
  # Downloads dataset from Cyberwave API, runs training, compresses results
  # Metrics sent to Cyberwave API (replaces WandB logging)
  training: |
    source "$HOME/.venv/smolvla/bin/activate" && \
    python train.py {body}

  # Results folder - directory where training outputs are saved
  # Cloud Node scans this folder for files to upload after training completes
  # Training produces a single {training_uuid}.tar.gz file here
  results_folder: ./runs/artifacts
  upload_results: true

  profile_slug: smolvla-policy

  # Operator config, applied by the entrypoints before building their runtime
  # config. Hierarchical, one subsection per entrypoint:
  #   train:  consumed by train.py (see below)
  #   deploy: reserved for inference/preview defaults — none for now
  #
  # config.train — defaults for any training field the JSON payload omits
  # (explicit top-level payload params win). Accepts any training field:
  # max_steps, batch_size, save_freq, log_freq, num_workers, lora_r,
  # optimizer_lr, ... Total steps supports the aliases max_steps / steps /
  # iterations, and an explicit value here OVERRIDES the training request's
  # policy.max_iterations (handled in smolvla_trainer._resolve_max_steps).
  #
  # NOTE: the values below are tuned for quick smoke-test iteration. Raise
  # save_freq / log_freq (and drop max_steps) before real training runs, or the
  # job will checkpoint/log every few steps.
  config:
    train:
      max_steps: 50000
      save_freq: 10000
      log_freq: 100
    # deploy: {}   # reserved for inference/preview defaults (none for now)
